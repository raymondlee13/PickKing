<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickKing — Log in</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bevan&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <span class="brand-mark">Pick<span>King</span></span>
    <span class="brand-tagline">Prop Edge Ledger</span>
  </div>
</header>
<main class="container auth-container">
  <form method="POST" action="/login" class="auth-form">
    <h2>Log in</h2>
    $error_html
    <label for="username">Username</label>
    <input type="text" name="username" id="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" name="password" id="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <div class="meta">No account yet? <a href="/register">Register</a></div>
  </form>
</main>
</body></html>
